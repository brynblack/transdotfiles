# Generated by noctalia from home/noctalia/templates/tmux.conf in the NixOS
# config, and rewritten on every palette change: edit the template, not this.

# Layout and Nerd Font icons from rose-pine/tmux (rose-pine.tmux, with
# show_current_program, user, date_time and directory on), in noctalia colours

# Transparent bar so the terminal background shows through
set -g status-style "bg=default,fg={{colors.on_surface.default.hex}}"
set -g status-left-length 200
set -g status-right-length 200

# Two status lines: an empty top one as a gap above the bar, and tmux's default
# format moved to the second. The reset first keeps a config reload from
# copying the already blanked line
set -gu status-format
set -gF "status-format[1]" "#{status-format[0]}"
set -g "status-format[0]" ""
set -g status 2

# Left: session (its icon turns error while the prefix is held), the active
# window's program, then the window list rendered as "<index> → <program>"
set -g status-left "#[fg=#{?client_prefix,{{colors.error.default.hex}},{{colors.primary.default.hex}}},bold] #[fg={{colors.primary.default.hex}}]#S#[nobold]  #[fg={{colors.on_surface_variant.default.hex}}] #W  "
setw -g window-status-style "fg={{colors.on_surface_variant.default.hex}},bg=default"
setw -g window-status-current-style "fg={{colors.primary.default.hex}},bg=default,bold"
setw -g window-status-format "#I #[fg={{colors.outline.default.hex}}]#[fg={{colors.on_surface_variant.default.hex}}] #W"
setw -g window-status-current-format "#I #[fg={{colors.outline.default.hex}}]#[fg={{colors.primary.default.hex}}] #W"
setw -g window-status-separator "#[fg={{colors.outline.default.hex}}]  "

# Right: user ← icon | time | weekday ← icon  folder icon directory
set -g status-right "#[fg={{colors.on_surface_variant.default.hex}}]#{client_user} #[fg={{colors.outline.default.hex}}] #[fg={{colors.on_surface_variant.default.hex}}] #[fg={{colors.outline.default.hex}}]| #[fg={{colors.on_surface_variant.default.hex}}]%H:%M #[fg={{colors.outline.default.hex}}]| #[fg={{colors.on_surface_variant.default.hex}}]%a #[fg={{colors.outline.default.hex}}] #[fg={{colors.on_surface_variant.default.hex}}]\U000F00F0    #[fg={{colors.tertiary.default.hex}}]#{b:pane_current_path} "

# Same border colour for active and inactive panes
set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.outline_variant.default.hex}}"

# Command prompt, copy-mode selection and the prefix-t clock. Since tmux 3.7
# the prompt only covers the whole status line when its style sets fill=
set -g message-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}},fill={{colors.surface_container.default.hex}}"
set -g message-command-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}},fill={{colors.surface_container.default.hex}}"
set -g mode-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"
set -g clock-mode-colour "{{colors.primary.default.hex}}"
